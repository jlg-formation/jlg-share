name: Déployer sur le VPS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Préparer la connexion SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transférer et déployer la version vérifiée
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          set -eu
          case "$VPS_HOST" in ''|*[!a-zA-Z0-9.-]*) exit 1;; esac
          case "$VPS_USER" in ''|*[!a-zA-Z0-9_-]*) exit 1;; esac
          git archive --format=tar.gz -o release.tar.gz HEAD
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/jlg-share/releases'
          scp -o StrictHostKeyChecking=yes release.tar.gz "$VPS_USER@$VPS_HOST:/opt/jlg-share/releases/$RELEASE.tar.gz"
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p /opt/jlg-share/releases/$RELEASE && tar -xzf /opt/jlg-share/releases/$RELEASE.tar.gz -C /opt/jlg-share/releases/$RELEASE && bash /opt/jlg-share/releases/$RELEASE/deploy/release.sh $RELEASE"
