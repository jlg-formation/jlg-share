name: Vérifications
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - name: Vérifier l'initialisation et les retours arrière avec des services simulés
        run: bash scripts/check-deployment.sh
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:e2e:dev
      - run: docker build -t jlg-share:check .
      - name: Vérifier l'image exécutée et les fichiers publics
        run: bash scripts/check-container.sh
      - name: Validate production configuration without displaying secrets
        env:
          APP_DOMAIN: share.example.test
          MEDIA_DOMAIN: media.example.test
          ACME_EMAIL: test@example.test
          ADMIN_PASSWORD_HASH: test-placeholder
          LIVEKIT_API_KEY: test-key
          LIVEKIT_API_SECRET: test-secret
        run: docker compose config --quiet
